name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: ./install.sh --dev

      - name: Tests
        run: .venv/bin/python -m pytest tests -q

      - name: Example run
        run: |
          .venv/bin/python examples/make_synthetic.py
          .venv/bin/bacteria-area --input examples/data --outdir results/example
          test -f results/example/areas.csv
